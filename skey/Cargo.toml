[package]
name = "skey"
version = "0.1.0"
edition = "2021"
authors = ["Gwang-Jin Kim <gwang.jin.kim.phd@gmail.com>"]
description = "Tiny OS-keyring env vault with enhanced protection for LLM agents"
license = "MIT"
repository = "https://github.com/gwangjinkim/skey"
homepage = "https://github.com/gwangjinkim/skey"
readme = "README.md"

[[bin]]
name = "skey"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rpassword = "7"
base64 = "0.22"

[profile.release]
strip = true
