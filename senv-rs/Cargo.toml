[package]
name = "senv"
version = "0.1.0"
edition = "2021"
description = "Tiny OS-keyring env vault (Rust port, interop with Go senv)"
license = "MIT"

[[bin]]
name = "senv"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rpassword = "7"
base64 = "0.22"

[profile.release]
strip = true
